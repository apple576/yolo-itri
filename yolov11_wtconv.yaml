# YOLOv11-P2: YOLO11 with P2 detection layer for small object detection
# For Road Defect Detection: 縱向裂縫, 橫向裂縫, 龜裂, 坑洞
# Based on vanilla YOLO11, only adding P2 layer without other modifications

# Parameters
nc: 80 # number of classes (will be overridden by data yaml)
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # YOLOv11n-P2
  s: [0.50, 0.50, 1024] # YOLOv11s-P2
  m: [0.50, 1.00, 512] # YOLOv11m-P2
  l: [1.00, 1.00, 512] # YOLOv11l-P2
  x: [1.00, 1.50, 512] # YOLOv11x-P2

# Backbone - Same as vanilla YOLO11
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2_WTConv, [256, False, 0.25, 1]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2_WTConv, [512, False, 0.25, 1]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2_WTConv, [512, True, 0.5, 1]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2_WTConv, [1024, True, 0.5, 1]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# Head - Modified to include P2 detection
head:
  # Top-down path (FPN)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2_WTConv, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2_WTConv, [256, False]] # 16 (P3/8)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]] # cat backbone P2
  - [-1, 2, C3k2_WTConv, [128, False]] # 19 (P2/4-xsmall)

  # Bottom-up path (PAN)
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 16], 1, Concat, [1]] # cat head P3
  - [-1, 2, C3k2_WTConv, [256, False]] # 22 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2_WTConv, [512, False]] # 25 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2_WTConv, [1024, True]] # 28 (P5/32-large)

  # Detect head with P2, P3, P4, P5
  - [[19, 22, 25, 28], 1, Detect, [nc]]
